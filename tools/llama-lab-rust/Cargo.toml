[package]
name = "llama-lab"
version = "0.1.0"
edition = "2021"
description = "Llama — The Lab: local LLM inference tuned to your GPU"

[[bin]]
name = "llama-lab"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.1"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
dirs = "6"
anyhow = "1"
ratatui-textarea = { version = "0.8", features = ["crossterm"] }

[profile.release]
opt-level = 3
